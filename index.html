    <div id="error-notification"></div>
    <div id="status-notification"></div>

    <script>
        let currentConversationId = null;
        let audioQueue = [];
        let isPlaying = false;
        let recognition;
        let currentAudio = null;
        let isConversationModeActive = false;
        let audioUnlocked = false;

        // Mobile audio handling - create audio element on user interaction
        let mobileAudioContext = null;
        let mobileAudioReady = false;
        
        function prepareMobileAudio() {
            if (mobileAudioReady) return;
            
            try {
                // Create audio element during user interaction
                mobileAudioContext = new Audio();
                mobileAudioContext.preload = 'metadata';
                mobileAudioContext.volume = 1.0;
                
                // Test with a data URL to unlock
                mobileAudioContext.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                
                const playPromise = mobileAudioContext.play();
                if (playPromise) {
                    playPromise.then(() => {
                        mobileAudioContext.pause();
                        mobileAudioContext.currentTime = 0;
                        mobileAudioReady = true;
                        audioUnlocked = true;
                        console.log('Mobile audio prepared and unlocked');
                    }).catch((error) => {
                        console.log('Mobile audio unlock failed:', error);
                        mobileAudioReady = true; // Still mark as ready
                        audioUnlocked = true;
                    });
                } else {
                    mobileAudioReady = true;
                    audioUnlocked = true;
                }
            } catch (error) {
                console.log('Mobile audio preparation failed:', error);
                mobileAudioReady = true;
                audioUnlocked = true;
            }
        }
        
        // Simple audio unlock function
        function unlockAudio() {
            if (audioUnlocked) return;
            prepareMobileAudio();
        }

        // --- Element variables ---
        let queryTextarea, sendButton, micButton, conversationModeToggle, originalPlaceholder;

        // Theme toggle with persistence
        const themeToggle = document.getElementById('theme-toggle');
        function setTheme(isDark) {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.checked = isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        themeToggle.addEventListener('change', () => {
            setTheme(themeToggle.checked);
        });
        if (localStorage.getItem('theme') === 'dark') setTheme(true);

        // Sidebar Menu Toggle
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        
        function toggleSidebar() {
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        }
        
        function closeSidebar() {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        }
        
        menuToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);

        // Close sidebar when clicking outside of it
        document.addEventListener('click', function(event) {
            const isClickInsideSidebar = sidebar.contains(event.target);
            const isClickOnMenuToggle = menuToggle.contains(event.target);

            if (!isClickInsideSidebar && !isClickOnMenuToggle && sidebar.classList.contains('active')) {
                closeSidebar();
            }
        });

        function closeSidebarIfMobile() {
            if (window.innerWidth <= 768) {
                closeSidebar();
            }
        }
        
        document.getElementById('conversation-select').addEventListener('change', closeSidebarIfMobile);
		sidebar.addEventListener('click', (event) => {
			if (event.target.tagName === 'BUTTON') {
                closeSidebarIfMobile();
            }
		});
		
		// Handle mobile viewport changes (keyboard open/close)
		let initialViewportHeight = window.innerHeight;
        
        function handleViewportChange() {
            const currentHeight = window.innerHeight;
            const heightDifference = initialViewportHeight - currentHeight;
            
            // If viewport height decreased significantly (keyboard likely opened)
            if (heightDifference > 150) {
                document.body.classList.add('keyboard-open');
                // Scroll to bottom of chat when keyboard opens
                const chat = document.getElementById('chat');
                setTimeout(() => {
                    chat.scrollTop = chat.scrollHeight;
                }, 100);
            } else {
                document.body.classList.remove('keyboard-open');
            }
        }
        
        window.addEventListener('resize', handleViewportChange);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                initialViewportHeight = window.innerHeight;
                handleViewportChange();
            }, 500);
        });

        // Add mobile audio test function (temporary for debugging)
        function testMobileAudio() {
            console.log('Testing mobile audio...');
            
            // Create a simple test audio with short base64
            const testAudio = new Audio();
            testAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
            
            testAudio.addEventListener('ended', () => {
                console.log('Test audio ended successfully');
            });
            
            testAudio.addEventListener('error', (e) => {
                console.error('Test audio error:', e);
            });
            
            testAudio.play().then(() => {
                console.log('Test audio played successfully');
            }).catch(error => {
                console.error('Test audio play failed:', error);
            });
        }
        
        // Unlock audio on first user interaction for mobile
        document.addEventListener('touchstart', () => {
            unlockAudio();
            // Also test basic audio capability
            setTimeout(testMobileAudio, 100);
        }, { once: true });
        document.addEventListener('click', () => {
            unlockAudio();
            // Also test basic audio capability
            setTimeout(testMobileAudio, 100);
        }, { once: true });

        function showError(message) {
            const notification = document.getElementById('error-notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 5000);
        }

        function showStatus(message) {
            const notification = document.getElementById('status-notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 3000);
        }

        async function loadModels() {
            try {
                const response = await fetch('/models');
                if (!response.ok) throw new Error(`Failed to load models: ${response.statusText}`);
                const models = await response.json();
                const select = document.getElementById('model-select');
                select.innerHTML = '<option>Select a model</option>';
                const lastModel = localStorage.getItem('lastModel');
                let selectedSet = false;
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.name;
                    option.textContent = model.displayName || model.name;
                    if (lastModel === model.name) {
                        option.selected = true;
                        selectedSet = true;
                    }
                    select.appendChild(option);
                });
                if (!selectedSet && lastModel) {
                    showError('Last used model not found; please select a model');
                }
                select.addEventListener('change', () => {
                    if (select.value !== 'Select a model') {
                        localStorage.setItem('lastModel', select.value);
                    }
                });
            } catch (error) {
                showError('Error loading models: ' + error.message);
            }
        }

        async function loadVoices() {
            try {
                const response = await fetch('/voices');
                if (!response.ok) throw new Error(`Failed to load voices: ${response.statusText}`);
                const voices = await response.json();
                const select = document.getElementById('voice-select');
                select.innerHTML = '<option>Select a voice</option>';
                const lastVoice = localStorage.getItem('lastVoice');
                let selectedSet = false;
                voices.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = JSON.stringify(voice);
                    option.textContent = `${voice.name} (${voice.lang}, ${voice.gender})`;
                    if (lastVoice === JSON.stringify(voice)) {
                        option.selected = true;
                        selectedSet = true;
                    }
                    select.appendChild(option);
                });
                if (!selectedSet && lastVoice) {
                    showError('Last used voice not found; please select a voice');
                }
                select.addEventListener('change', () => {
                    if (select.value !== 'Select a voice') {
                        localStorage.setItem('lastVoice', select.value);
                    }
                });
                if (voices.length === 0) {
                    showError('No voices available. Check API keys (e.g., Google Cloud TTS).');
                }
            } catch (error) {
                showError('Error loading voices: ' + error.message);
            }
        }

        async function loadConversations() {
            try {
                const response = await fetch('/conversations');
                if (!response.ok) throw new Error(`Failed to load conversations: ${response.statusText}`);
                const ids = await response.json();
                const select = document.getElementById('conversation-select');
                select.innerHTML = '<option value="">Select conversation</option>';
                for (const id of ids) {
                    try {
                        const convResponse = await fetch(`/conversation/${id}`);
                        if (!convResponse.ok) continue;
                        const conversation = await convResponse.json();
                        const firstMessage = conversation[0]?.content || id;
                        const timestampPart = id.split('_').pop();
                        let timestamp = 'Unknown'; // Default value
                        try {
                            const parsableDateString = timestampPart.substring(0, 10) + ' ' + timestampPart.substring(11).replace(/-/g, ':');
                            const date = new Date(parsableDateString);
                            if (!isNaN(date.getTime())) {
                                const options = { year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' };
                                timestamp = date.toLocaleString(undefined, options);
                            }
                        } catch {
                            timestamp = id;
                        }
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = `${timestamp}: ${firstMessage.substring(0, 30)}${firstMessage.length > 30 ? '...' : ''}`;
                        option.title = id;
                        select.appendChild(option);
                    } catch {
                        console.error(`Failed to load conversation ${id}`);
                    }
                }
            } catch (error) {
                showError('Error loading conversations: ' + error.message);
            }
        }
        async function loadConversation(id) {
            if (!id) return;
            currentConversationId = id;
            try {
                const response = await fetch(`/conversation/${id}`);
                if (!response.ok) throw new Error(`Failed to load conversation: ${response.statusText}`);
                const history = await response.json();
                const chat = document.getElementById('chat');
                chat.innerHTML = ''; // Clear chat
                history.forEach(msg => {
                    addMessage(msg.role, msg.content);
                });
            } catch (error) {
                showError('Error loading conversation: ' + error.message);
            }
        }

        function newConversation() {
            currentConversationId = null;
            document.getElementById('chat').innerHTML = '';
            document.getElementById('conversation-select').value = '';
            loadConversations();
        }

        async function deleteConversation() {
            if (!currentConversationId) {
                showError('No conversation selected');
                return;
            }
            try {
                const response = await fetch(`/conversation/${currentConversationId}`, { method: 'DELETE' });
                if (!response.ok) throw new Error(`Failed to delete conversation: ${response.statusText}`);
                newConversation();
                loadConversations();
            } catch (error) {
                showError('Error deleting conversation: ' + error.message);
            }
        }

        async function refreshCache() {
            try {
                const response = await fetch('/refresh-cache', { method: 'POST' });
                if (!response.ok) throw new Error(`Failed to refresh cache: ${response.statusText}`);
                await Promise.all([loadModels(), loadVoices()]);
                showStatus('Cache refreshed successfully');
            } catch (error) {
                showError('Error refreshing cache: ' + error.message);
            }
        }

        // Simple syntax highlighting for common languages
        function highlightCode(code, language) {
            if (!language) return code;
            
            let highlighted = code;
            
            switch (language.toLowerCase()) {
                case 'javascript':
                case 'js':
                    // Keywords
                    highlighted = highlighted.replace(/\b(function|const|let|var|if|else|for|while|return|class|extends|import|export|async|await|try|catch|finally)\b/g, '<span style="color: #569cd6;">$1</span>');
                    // Strings
                    highlighted = highlighted.replace(/(["'`])((?:\\.|(?!\1)[^\\])*?)\1/g, '<span style="color: #ce9178;">$1$2$1</span>');
                    // Comments
                    highlighted = highlighted.replace(/\/\/.*$/gm, '<span style="color: #6a9955;">$&</span>');
                    highlighted = highlighted.replace(/\/\*[\s\S]*?\*\//g, '<span style="color: #6a9955;">$&</span>');
                    break;
                    
                case 'python':
                case 'py':
                    // Keywords
                    highlighted = highlighted.replace(/\b(def|class|if|elif|else|for|while|import|from|return|try|except|finally|with|as|lambda|yield|async|await)\b/g, '<span style="color: #569cd6;">$1</span>');
                    // Strings
                    highlighted = highlighted.replace(/(["'`])((?:\\.|(?!\1)[^\\])*?)\1/g, '<span style="color: #ce9178;">$1$2$1</span>');
                    // Comments
                    highlighted = highlighted.replace(/#.*$/gm, '<span style="color: #6a9955;">$&</span>');
                    break;
                    
                case 'html':
                    // Tags
                    highlighted = highlighted.replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9]*)(.*?)(&gt;)/g, '<span style="color: #569cd6;">$1</span><span style="color: #4ec9b0;">$2</span>$3<span style="color: #569cd6;">$4</span>');
                    // Attributes
                    highlighted = highlighted.replace(/(\s+)([a-zA-Z-]+)(=)/g, '$1<span style="color: #92c5f8;">$2</span>$3');
                    break;
                    
                case 'css':
                    // Selectors
                    highlighted = highlighted.replace(/^([.#]?[a-zA-Z][a-zA-Z0-9-_]*)\s*{/gm, '<span style="color: #d7ba7d;">$1</span> {');
                    // Properties
                    highlighted = highlighted.replace(/([a-zA-Z-]+)(\s*:)/g, '<span style="color: #9cdcfe;">$1</span>$2');
                    // Values
                    highlighted = highlighted.replace(/(:\s*)([^;}\n]+)/g, '$1<span style="color: #ce9178;">$2</span>');
                    break;
                    
                case 'json':
                    // Keys
                    highlighted = highlighted.replace(/(["'])([^"']+)(["']\s*:)/g, '<span style="color: #9cdcfe;">$1$2$1</span>:');
                    // Strings
                    highlighted = highlighted.replace(/(:\s*)(["'])([^"']*)(["'])/g, '$1<span style="color: #ce9178;">$2$3$4</span>');
                    // Numbers
                    highlighted = highlighted.replace(/(:\s*)(\d+\.?\d*)/g, '$1<span style="color: #b5cea8;">$2</span>');
                    // Booleans/null
                    highlighted = highlighted.replace(/\b(true|false|null)\b/g, '<span style="color: #569cd6;">$1</span>');
                    break;
            }
            
            return highlighted;
        }

        function formatMessage(content) {
            // Comprehensive markdown parser
            let html = content;
            
            // Escape HTML first to prevent injection
            html = html.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;');
            
            // Code blocks (``` or ~~~) - must be before other formatting
            html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
                const language = lang ? ` data-language="${lang}"` : '';
                const highlightedCode = lang ? highlightCode(code.trim(), lang) : code.trim();
                return `<pre class="code-block"${language}><code>${highlightedCode}</code></pre>`;
            });
            
            html = html.replace(/~~~(\w+)?\n?([\s\S]*?)~~~/g, (match, lang, code) => {
                const language = lang ? ` data-language="${lang}"` : '';
                const highlightedCode = lang ? highlightCode(code.trim(), lang) : code.trim();
                return `<pre class="code-block"${language}><code>${highlightedCode}</code></pre>`;
            });
            
            // Inline code (but not inside code blocks)
            html = html.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
            
            // Headers (# ## ### #### ##### ######)
            html = html.replace(/^######\s+(.+)$/gm, '<h6 class="md-h6">$1</h6>');
            html = html.replace(/^#####\s+(.+)$/gm, '<h5 class="md-h5">$1</h5>');
            html = html.replace(/^####\s+(.+)$/gm, '<h4 class="md-h4">$1</h4>');
            html = html.replace(/^###\s+(.+)$/gm, '<h3 class="md-h3">$1</h3>');
            html = html.replace(/^##\s+(.+)$/gm, '<h2 class="md-h2">$1</h2>');
            html = html.replace(/^#\s+(.+)$/gm, '<h1 class="md-h1">$1</h1>');
            
            // Process lists properly
            // Unordered lists
            html = html.replace(/^[\s]*[-*+]\s+(.+)$/gm, '<LISTITEM>$1</LISTITEM>');
            html = html.replace(/(<LISTITEM>.*?<\/LISTITEM>(?:\n<LISTITEM>.*?<\/LISTITEM>)*)/g, (match) => {
                const items = match.replace(/<LISTITEM>/g, '<li class="md-list-item">').replace(/<\/LISTITEM>/g, '</li>');
                return `<ul class="md-list">${items}</ul>`;
            });
            
            // Ordered lists
            html = html.replace(/^[\s]*(\d+)\.\s+(.+)$/gm, '<ORDEREDITEM>$2</ORDEREDITEM>');
            html = html.replace(/(<ORDEREDITEM>.*?<\/ORDEREDITEM>(?:\n<ORDEREDITEM>.*?<\/ORDEREDITEM>)*)/g, (match) => {
                const items = match.replace(/<ORDEREDITEM>/g, '<li class="md-list-item-ordered">').replace(/<\/ORDEREDITEM>/g, '</li>');
                return `<ol class="md-list-ordered">${items}</ol>`;
            });
            
            // Bold and italic (order matters - do most specific first)
            html = html.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/___([^_\n]+)___/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
            html = html.replace(/_([^_\n]+)_/g, '<em>$1</em>');
            
            // Strikethrough
            html = html.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
            
            // Links [text](url)
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            
            // Auto-links for URLs (but not if already in links)
            html = html.replace(/(?<!href="|">)(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
            
            // Blockquotes
            html = html.replace(/^>\s*(.+)$/gm, '<blockquote class="md-blockquote">$1</blockquote>');
            
            // Horizontal rules
            html = html.replace(/^---+$/gm, '<hr class="md-hr">');
            html = html.replace(/^\*\*\*+$/gm, '<hr class="md-hr">');
            html = html.replace(/^___+$/gm, '<hr class="md-hr">');
            
            // Line breaks (convert \n to <br> but not around block elements)
            html = html.replace(/\n/g, '<br>');
            
            // Clean up extra line breaks around block elements
            html = html.replace(/<br>\s*(<(?:h[1-6]|ul|ol|blockquote|hr|pre)[^>]*>)/g, '$1');
            html = html.replace(/(<\/(?:h[1-6]|ul|ol|blockquote|hr|pre)>)\s*<br>/g, '$1');
            html = html.replace(/(<\/li>)<br>/g, '$1');
            html = html.replace(/<br>(<li)/g, '$1');
            
            return html;
        }

        function addMessage(role, content) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message';
            
            const roleSpan = document.createElement('strong');
            roleSpan.textContent = `${role}: `;
            
            const contentSpan = document.createElement('span');
            contentSpan.className = 'message-content';
            contentSpan.innerHTML = formatMessage(content);
            
            div.appendChild(roleSpan);
            div.appendChild(contentSpan);
            
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            
            return div; // Return the message div for streaming updates
        }

        async function sendMessage() {
            const query = queryTextarea.value.trim();
            const model = document.getElementById('model-select').value;
            const maxTokens = parseInt(document.getElementById('max-tokens').value);
            const streamingEnabled = document.getElementById('streaming-toggle').checked;
            const turboMode = document.getElementById('turbo-mode-toggle').checked;
            
            if (!query) {
                showError('Please enter a message');
                return;
            }
            if (model === 'Select a model') {
                showError('Please select a model');
                return;
            }
            if (isNaN(maxTokens) || maxTokens < 0) {
                showError('Max tokens must be 0 or greater (0 = unlimited)');
                return;
            }
            
            addMessage('user', query);
            queryTextarea.value = '';

            queryTextarea.placeholder = 'Thinking...';
            queryTextarea.disabled = true;
            sendButton.disabled = true;
            micButton.disabled = true;
            
            let isAudioPlaybackExpected = false;

            try {
                const body = { 
                    query, 
                    conversationId: currentConversationId, 
                    model, 
                    maxTokens,
                    stream: streamingEnabled,
                    turboMode
                };

                if (streamingEnabled) {
                    // Handle streaming response
                    const response = await fetch('/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || `Query failed: ${response.statusText}`);
                    }

                    // Re-enable UI immediately for streaming mode
                    queryTextarea.placeholder = 'AI is responding...';
                    queryTextarea.disabled = false;
                    sendButton.disabled = false;
                    micButton.disabled = isConversationModeActive;
                    conversationModeToggle.disabled = false;
                    if (isConversationModeActive) {
                        startContinuousRecognition();
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let assistantMessageDiv = null;
                    let fullResponse = '';
                    let buffer = '';

                    try {
                        while (true) {
                            const { done, value } = await reader.read();
                            
                            if (done) {
                                // Process any remaining buffer
                                if (buffer.trim()) {
                                    const lines = buffer.split('\n').filter(line => line.trim() !== '');
                                    for (const line of lines) {
                                        if (line.startsWith('data: ')) {
                                            try {
                                                const data = JSON.parse(line.slice(6));
                                                
                                                // Handle server status messages
                                                if (data.serverStatus) {
                                                    addServerStatusMessage(data.serverStatus, data.timestamp);
                                                }
                                                
                                                if (data.done) {
                                                    if (assistantMessageDiv) {
                                                        assistantMessageDiv.classList.remove('streaming');
                                                    }
                                                    currentConversationId = data.conversationId;
                                                    loadConversations();
                                                    queryTextarea.placeholder = originalPlaceholder;
                                                }
                                            } catch (parseError) {
                                                console.warn('Failed to parse final streaming data:', parseError.message);
                                            }
                                        }
                                    }
                                }
                                break;
                            }

                            // Decode the chunk and add to buffer
                            const chunk = decoder.decode(value, { stream: true });
                            buffer += chunk;

                            // Process complete lines from buffer
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || ''; // Keep incomplete line in buffer
                            
                            for (const line of lines) {
                                if (line.trim() && line.startsWith('data: ')) {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        
                                        if (data.error) {
                                            throw new Error(data.error);
                                        }
                                        
                                        // Handle server status messages
                                        if (data.serverStatus) {
                                            addServerStatusMessage(data.serverStatus, data.timestamp);
                                        }
                                        
                                        if (data.content) {
                                            fullResponse += data.content;
                                            
                                            // Create assistant message div if it doesn't exist
                                            if (!assistantMessageDiv) {
                                                assistantMessageDiv = addMessage('assistant', '');
                                                assistantMessageDiv.classList.add('streaming');
                                            }
                                            
                                            // Update the message content with streaming text immediately
                                            const messageContent = assistantMessageDiv.querySelector('.message-content');
                                            messageContent.innerHTML = formatMessage(fullResponse);
                                            
                                            // Auto-scroll to bottom
                                            const chat = document.getElementById('chat');
                                            chat.scrollTop = chat.scrollHeight;
                                        }
                                        
                                        if (data.done) {
                                            // Remove streaming animation
                                            if (assistantMessageDiv) {
                                                assistantMessageDiv.classList.remove('streaming');
                                            }
                                            
                                            currentConversationId = data.conversationId;
                                            loadConversations();
                                            
                                            // Reset placeholder
                                            queryTextarea.placeholder = originalPlaceholder;
                                            
                                            // Handle TTS for the complete response
                                            const voiceSelect = document.getElementById('voice-select');
                                            const voiceObj = voiceSelect.value !== 'Select a voice' ? JSON.parse(voiceSelect.value) : null;
                                            if (voiceObj && fullResponse.trim()) {
                                                if (isConversationModeActive && recognition) {
                                                    recognition.stop();
                                                }
                                                // For streaming mode, play TTS in background without disabling UI
                                                playTTSBackground(fullResponse, voiceObj);
                                            }
                                            break;
                                        }
                                    } catch (parseError) {
                                        console.warn('Failed to parse streaming data:', parseError.message);
                                    }
                                }
                            }
                        }
                    } finally {
                        reader.releaseLock();
                    }
                    
                    // For streaming mode, don't set isAudioPlaybackExpected here
                    // because we already handled UI re-enabling above
                    return; // Exit early to avoid the finally block
                } else {
                    // Handle non-streaming response (original logic)
                    const response = await fetch('/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || `Query failed: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    currentConversationId = data.conversationId;
                    addMessage('assistant', data.response);
                    loadConversations();
                    
                    const voiceSelect = document.getElementById('voice-select');
                    const voiceObj = voiceSelect.value !== 'Select a voice' ? JSON.parse(voiceSelect.value) : null;
                    if (voiceObj) {
                        isAudioPlaybackExpected = true;
                        if (isConversationModeActive && recognition) {
                            recognition.stop();
                        }
                        playTTS(data.response, voiceObj);
                    }
                }
            } catch (error) {
                showError('Error sending message: ' + error.message);
            } finally {
                if (!isAudioPlaybackExpected) {
                    queryTextarea.placeholder = originalPlaceholder;
                    queryTextarea.disabled = false;
                    sendButton.disabled = false;
                    micButton.disabled = isConversationModeActive;
                    conversationModeToggle.disabled = false;
                    if (isConversationModeActive) {
                        startContinuousRecognition();
                    }
                }
            }
        }

        async function playTTS(text, voiceObj) {
            queryTextarea.placeholder = 'Generating audio...';
            try {
                const response = await fetch('/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voiceObj })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `TTS failed: ${response.statusText}`);
                }
                const { audioFiles } = await response.json();
                audioFiles.forEach(file => {
                    if (file) audioQueue.push(file);
                });
                if (!isPlaying && sendButton.disabled) playNextAudio();
            } catch (error) {
                showError('Error generating audio: ' + error.message);
                queryTextarea.placeholder = originalPlaceholder;
                queryTextarea.disabled = false;
                sendButton.disabled = false;
                micButton.disabled = isConversationModeActive;
                conversationModeToggle.disabled = false;
            }
        }

        async function playTTSBackground(text, voiceObj) {
            // Background TTS for streaming mode - doesn't disable UI
            const originalPlaceholderValue = queryTextarea.placeholder;
            queryTextarea.placeholder = 'Generating audio...';
            
            try {
                const response = await fetch('/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voiceObj })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `TTS failed: ${response.statusText}`);
                }
                const { audioFiles } = await response.json();
                audioFiles.forEach(file => {
                    if (file) audioQueue.push(file);
                });
                if (!isPlaying) playNextAudioBackground();
            } catch (error) {
                showError('Error generating audio: ' + error.message);
            } finally {
                // Restore placeholder only if it hasn't changed
                if (queryTextarea.placeholder === 'Generating audio...') {
                    queryTextarea.placeholder = originalPlaceholderValue;
                }
            }
        }

        function playNextAudio() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                currentAudio = null;
                queryTextarea.placeholder = originalPlaceholder;
                queryTextarea.disabled = false;
                sendButton.disabled = false;
                micButton.disabled = isConversationModeActive;
                conversationModeToggle.disabled = false;
                if (isConversationModeActive) {
                    startContinuousRecognition();
                }
                return;
            }
            
            isPlaying = true;
            queryTextarea.placeholder = 'Playing audio...';
            
            const audioFile = audioQueue.shift();
            console.log('Playing audio file:', audioFile);
            
            // Use mobile audio context if available, otherwise create new
            if (mobileAudioContext && mobileAudioReady) {
                console.log('Using mobile audio context');
                currentAudio = mobileAudioContext;
                
                // Clean up any existing listeners
                currentAudio.removeEventListener('ended', playNextAudio);
                currentAudio.removeEventListener('error', null);
                
                // Set new source
                currentAudio.src = audioFile;
                
                // Add fresh listeners
                currentAudio.addEventListener('ended', playNextAudio, { once: true });
                currentAudio.addEventListener('error', (e) => {
                    console.error('Mobile audio error:', e);
                    showError('Error playing audio file.');
                    stopTTS();
                }, { once: true });
                
                // Load and play
                currentAudio.load();
                currentAudio.play().catch(error => {
                    console.error('Mobile audio play failed:', error);
                    showError('Mobile audio blocked. Please tap the page first.');
                    stopTTS();
                });
                
            } else {
                console.log('Using standard audio element');
                currentAudio = new Audio(audioFile);
                
                // Add debugging for desktop/fallback
                currentAudio.addEventListener('loadedmetadata', () => {
                    console.log('Audio: loadedmetadata, duration:', currentAudio.duration);
                });
                currentAudio.addEventListener('play', () => console.log('Audio: play event fired'));
                currentAudio.addEventListener('playing', () => console.log('Audio: playing'));
                currentAudio.addEventListener('ended', () => {
                    console.log('Audio: ended');
                    playNextAudio();
                });
                currentAudio.addEventListener('error', (e) => {
                    console.error('Audio error:', e);
                    showError('Error playing audio file.');
                    stopTTS();
                });
                
                // Try to play immediately
                console.log('Attempting to play audio...');
                const playPromise = currentAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('Audio play promise resolved successfully');
                    }).catch(error => {
                        console.error('Audio play failed:', error);
                        showError('Audio blocked. Please tap anywhere on the page first.');
                        stopTTS();
                    });
                }
            }
        }

        function playNextAudioBackground() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                currentAudio = null;
                return;
            }
            
            isPlaying = true;
            currentAudio = new Audio();
            
            // Set properties for mobile compatibility
            currentAudio.preload = 'auto';
            currentAudio.volume = 1.0;
            
            const audioFile = audioQueue.shift();
            
            currentAudio.addEventListener('loadeddata', () => {
                setTimeout(() => {
                    if (currentAudio) {
                        const playPromise = currentAudio.play();
                        if (playPromise) {
                            playPromise.catch(error => {
                                console.error('Background audio play failed:', error);
                                isPlaying = false;
                                currentAudio = null;
                            });
                        }
                    }
                }, 50);
            });
            
            currentAudio.addEventListener('ended', playNextAudioBackground);
            currentAudio.addEventListener('error', () => {
                console.error('Error playing audio file.');
                isPlaying = false;
                currentAudio = null;
            });
            
            currentAudio.src = audioFile;
        }

        function stopTTS() {
            showStatus('Stopped audio');
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            audioQueue = [];
            isPlaying = false;
            currentAudio = null;
            queryTextarea.placeholder = originalPlaceholder;
            queryTextarea.disabled = false;
            sendButton.disabled = false;
            micButton.disabled = isConversationModeActive;
            conversationModeToggle.disabled = false;

            if (isConversationModeActive) {
                startContinuousRecognition();
            }
        }

        function startRecording() {
            if (!('webkitSpeechRecognition' in window)) {
                showError('Speech recognition not supported in this browser. Try typing your message.');
                return;
            }
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            
            recognition.onstart = () => {
                micButton.textContent = '🔴 Listening...';
                queryTextarea.placeholder = 'Listening...';
                queryTextarea.disabled = true;
                sendButton.disabled = true;
            };
            
            recognition.onresult = event => {
                const transcript = event.results[0][0].transcript;
                queryTextarea.value = transcript;
                sendMessage();
            };

            recognition.onerror = (event) => {
                showError('Speech recognition error: ' + event.error + '. Please try again.');
                queryTextarea.placeholder = originalPlaceholder;
                queryTextarea.disabled = false;
                sendButton.disabled = false;
            };

            recognition.onend = () => {
                micButton.innerHTML = '🎤 Start Recording';
                if (queryTextarea.placeholder === 'Listening...') {
                    queryTextarea.placeholder = originalPlaceholder;
                    queryTextarea.disabled = false;
                    sendButton.disabled = false;
                }
            };
            recognition.start();
        }

        // --- Conversation Mode Functions ---

        function toggleConversationMode() {
            isConversationModeActive = conversationModeToggle.checked;
            if (isConversationModeActive) {
                startContinuousRecognition();
                conversationModeToggle.parentElement.parentElement.classList.add('active-mode');
                micButton.disabled = true;
            } else {
                stopContinuousRecognition();
            }
        }

        function startContinuousRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                showError('Speech recognition not supported in this browser.');
                isConversationModeActive = false; 
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            
            // MODIFIED: Added onstart handler to change placeholder
            recognition.onstart = () => {
                queryTextarea.placeholder = 'Listening...';
            };

            recognition.onresult = (event) => {
                let final_transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final_transcript += event.results[i][0].transcript;
                    }
                }
                
                final_transcript = final_transcript.trim();
                if (final_transcript) {
                    queryTextarea.value = final_transcript;
                    recognition.stop();
                    sendMessage();
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    return; 
                }
                showError('Speech recognition error: ' + event.error);
                stopContinuousRecognition();
            };

            recognition.onend = () => {
                if (isConversationModeActive && !isPlaying) {
                    recognition.start();
                }
            };
            
            recognition.start();
        }

        function stopContinuousRecognition() {
            if (recognition) {
                recognition.stop();
            }
            isConversationModeActive = false;
            conversationModeToggle.checked = false;
            conversationModeToggle.parentElement.parentElement.classList.remove('active-mode');
            micButton.disabled = false;
            // MODIFIED: Reset placeholder when mode is stopped
            queryTextarea.placeholder = originalPlaceholder;
            showStatus('Conversation mode stopped.');
        }


        document.getElementById('query').addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        
        // Server status functionality
        let serverStatusEnabled = false;
        let serverStatusLog = null;
        
        function addServerStatusMessage(message, timestamp) {
            if (!serverStatusEnabled || !serverStatusLog) return;
            
            const logEntry = document.createElement('div');
            logEntry.style.marginBottom = '4px';
            logEntry.style.fontSize = '11px';
            logEntry.style.color = 'var(--text-secondary)';
            
            const timeStr = new Date(timestamp).toLocaleTimeString();
            logEntry.innerHTML = `<span style="color: var(--text-muted);">[${timeStr}]</span> ${message}`;
            
            serverStatusLog.appendChild(logEntry);
            serverStatusLog.scrollTop = serverStatusLog.scrollHeight;
            
            // Keep only last 50 entries
            while (serverStatusLog.children.length > 50) {
                serverStatusLog.removeChild(serverStatusLog.firstChild);
            }
        }
        
        function clearServerStatusLog() {
            if (serverStatusLog) {
                serverStatusLog.innerHTML = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            queryTextarea = document.getElementById('query');
            sendButton = document.getElementById('send-button');
            micButton = document.getElementById('mic-button');
            conversationModeToggle = document.getElementById('conversation-mode-toggle');
            originalPlaceholder = queryTextarea.placeholder;

            conversationModeToggle.addEventListener('change', toggleConversationMode);
            
            // Setup server status toggle
            const serverStatusToggle = document.getElementById('server-status-toggle');
            const serverStatusSection = document.getElementById('server-status-section');
            serverStatusLog = document.getElementById('server-status-log');
            
            serverStatusToggle.addEventListener('change', (e) => {
                serverStatusEnabled = e.target.checked;
                serverStatusLog.style.display = serverStatusEnabled ? 'block' : 'none';
                
                if (serverStatusEnabled) {
                    addServerStatusMessage('Server status logging enabled', new Date().toISOString());
                } else {
                    clearServerStatusLog();
                }
            });
            
            // Show server status section when streaming is enabled
            const streamingToggle = document.getElementById('streaming-toggle');
            streamingToggle.addEventListener('change', (e) => {
                serverStatusSection.style.display = e.target.checked ? 'block' : 'none';
            });
            
            // Show initially if streaming is enabled
            if (streamingToggle.checked) {
                serverStatusSection.style.display = 'block';
            }

            loadModels();
            loadVoices();
            loadConversations();
        });
    </script>
</body>
</html>
